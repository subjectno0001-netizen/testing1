    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;

    .logo {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #00000000;
      box-shadow: 0 0 25px #ffffff18;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #ffffff;
      font-size: 13px;
      margin-top: 8px;
      margin-bottom: 28px;
      letter-spacing: 2px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 76px;
      padding: 15px 18px;
      color: #fff;
      text-decoration: none;
      text-align: left;
      background: rgba(18,18,18,.88);
      border: 1px solid #555;
      border-radius: 13px;
      transition: .2s ease;
      backdrop-filter: blur(8px);
    }

    .link:hover {
      transform: translateY(-3px);
      border-color: #fff;
      background: rgba(45,45,45,.95);
      box-shadow: 0 5px 22px #ffffff13;
    }

    .icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 27px;
    }

    
    

.whatsapp-logo {
  width: 32px;
  height: 32px;
  object-fit: contain;
  display: block;
}




    .link-text {
      flex: 1;
      min-width: 0;
    }

    .link-text strong {
      display: block;
      font-size: 15px;
      line-height: 1.4;
    }

    .arrow {
      color: #aaa;
      font-size: 22px;
    }

    .note {
      margin-top: 25px;
      padding: 13px 10px;
      color: #ffffff;
      background: #00000000;
      font-size: 12px;
      font-weight: 900;
      font-style: italic;
      border-radius: 4px;
      transform: skew(-2deg);
    }

    footer {
      margin-top: 28px;
      padding-top: 17px;
      border-top: 1px solid #444;
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 24px;
      }

      .link {
        padding: 13px;
      }
    }
